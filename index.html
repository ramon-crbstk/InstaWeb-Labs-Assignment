<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>assignment</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 125vh;
    }
    header {
      padding: 0.1rem;
      background-color: #333;
      color: #fff;
      text-align: center;
    }
    .builder {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .sidebar {
      width: 100px;
      padding: 1rem;
      background: #f4f4f4;
      border-right: 1px solid #ccc;
    }
    .canvas {
      flex: 1;
      padding: 1rem;
      position: relative;
      background: #fff;
      border: 1px solid #ccc;
  
    }
    .canvas-element {
      position: absolute;
      cursor: move;
    }
    .form {
      padding: 1rem;
      border-top: 1px solid #ccc;
      background: #f9f9f9;
    }
    input, select {
      width: 100%;
      margin-bottom: 10px;
      padding: 5px;
    }
    button {
      /* width: 60%; */
      padding: 8px;
      background: #333;
      color: white;
      border: none;
      margin-top: 10px;
    }
    button:hover{
      background: #ff0000;
      cursor: pointer;
    }
    @media (max-width: 600px) {
      .builder {
        flex-direction: column;
      }
      .sidebar {
        width: 60%;
        border-right: none;
        border-bottom: 1px solid #ccc;
      }
      .center-button button{
        width: 50%;
      }
      /* footer {
      background-color: #979797;
      color: #eee;
      padding: 20px 40px;
      text-align: center;
      height: 10vh;
    }

    .footer h3 {
      margin: 0;
      font-size: 20px;
    }

    .footer p {
      margin: 5px 0;
      font-size: 14px;
    } */



    }
  </style>
</head>
<body>
  <header>
    <h1>Assignment</h1>
  </header>
  <div class="builder">
    <div class="sidebar">
      <button draggable="true" class="element-btn" data-type="text">Text</button>
      <button draggable="true" class="element-btn" data-type="image">Image</button>
      <button draggable="true" class="element-btn" data-type="button">Button</button>
    </div>
    <div class="canvas" id="canvas"></div>
  </div>
  <div class="form" id="form">
    <h3>Edit Properties</h3>
    <input type="text" id="propText" placeholder="Text or Image URL" />
    <input type="number" id="propFontSize" placeholder="Font Size (px)" />
    <input type="color" id="propColor" placeholder="Color" />
  <div class="center-button">  <button onclick="applyChanges()">Apply</button></div>
  </div>  
  <div class="footerr">
  <footer id="footer" class="footer">
    <center><h3>Ramon Bakuri</h3>
    <p>Email: ramonrbakuri@gmail.com | Phone: +91 84338 77879</p>
   <p>Thank you for your time</p> </center>
  </footer></div>
  <script>
    const canvas = document.getElementById("canvas");
    let selectedElement = null;

    document.querySelectorAll(".element-btn").forEach(btn => {
      btn.addEventListener("dragstart", e => {
        e.dataTransfer.setData("type", e.target.dataset.type);
      });
    });

    canvas.addEventListener("dragover", e => {
      e.preventDefault();
    });

    canvas.addEventListener("drop", e => {
      e.preventDefault();
      const type = e.dataTransfer.getData("type");
      let el;

      if (type === "text") {
        el = document.createElement("div");
        el.textContent = "Editable Text";
      } else if (type === "image") {
        el = document.createElement("img");
        el.src = "./web-developer.jpg";
        el.width = 120;
      } else if (type === "button") {
        el = document.createElement("button");
        el.textContent = "Click Me";
      }

      el.classList.add("canvas-element");
      el.style.top = e.offsetY + "px";
      el.style.left = e.offsetX + "px";
      el.setAttribute("draggable", true);
      el.addEventListener("dragend", dragEnd);
      el.addEventListener("click", () => {
        selectedElement = el;
        populateForm(el);
      });

      canvas.appendChild(el);
    });

    function dragEnd(e) {
      e.target.style.top = e.offsetY + "px";
      e.target.style.left = e.offsetX + "px";
    }

    function populateForm(el) {
      document.getElementById("propText").value = el.textContent || el.src || "";
      document.getElementById("propFontSize").value = parseInt(getComputedStyle(el).fontSize) || "";
      document.getElementById("propColor").value = rgbToHex(getComputedStyle(el).color);
    }

    function applyChanges() {
      if (!selectedElement) return;
      const text = document.getElementById("propText").value;
      const fontSize = document.getElementById("propFontSize").value;
      const color = document.getElementById("propColor").value;

      if (selectedElement.tagName === "IMG") {
        selectedElement.src = text;
      } else {
        selectedElement.textContent = text;
        selectedElement.style.color = color;
      }
      selectedElement.style.fontSize = fontSize + "px";
    }

    function rgbToHex(rgb) {
      const result = rgb.match(/\d+/g).map(x => (+x).toString(16).padStart(2, '0'));
      return `#${result.join('')}`;
    }
  </script>
</body>
</html>
